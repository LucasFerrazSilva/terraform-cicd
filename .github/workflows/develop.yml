name: "Dev Deploy"

on:
  push:
    branches:
      - develop

permissions:
      id-token: write   # This is required for requesting the JWT
      contents: read 

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: dev
      aws-statefile-s3-bucket: "terraform-cicd-statefile"
      aws-lock-dynamodb-table: "terraform-cicd-lock"
      
